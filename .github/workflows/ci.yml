name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
      - name: Size budgets
        run: pnpm --filter @kit/ui size
      - name: Build Storybook
        run: pnpm --filter @kit/ui build-storybook
      - run: pnpm --filter @kit/ui exec playwright install --with-deps chromium
      # Visual baselines are committed for darwin only so far; Linux baselines still need generating (see STATUS).
      - name: Browser tests (axe, keyboard; visual excluded)
        run: pnpm --filter @kit/ui exec playwright test --grep-invert @visual
