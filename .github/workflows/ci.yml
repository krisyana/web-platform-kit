name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Browsers must exist before `pnpm run ci`, whose test task includes the demo's Playwright e2e.
      - run: pnpm --filter @kit/ui exec playwright install --with-deps chromium
      - name: Require a changeset for published-package changes
        if: github.event_name == 'pull_request'
        run: pnpm exec changeset status --since=origin/${{ github.base_ref }}
      - name: Release dry run (publint, attw, publish --dry-run)
        run: pnpm release:dry-run
      - run: pnpm run ci
      - name: Size budgets
        run: pnpm --filter @kit/ui size
      - name: Build Storybook
        run: pnpm --filter @kit/ui build-storybook
      - name: Browser tests (axe, keyboard, visual regression against Linux baselines)
        run: pnpm --filter @kit/ui exec playwright test
  perf:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Size budgets and Lighthouse CI (fail on regression)
        working-directory: apps/demo
        run: pnpm size && pnpm lhci
